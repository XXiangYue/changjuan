[project]
name = "novel-agent"
version = "1.0.0"
description = "长卷 · 有记忆、可审阅的长篇小说创作工作台"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.15.0",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "langchain-anthropic==1.7.6",
    "python-dotenv==1.2.4",
    "prompt_toolkit==3.0.53",
    "pyyaml==6.0.3",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "langgraph-checkpoint-sqlite==3.1.2",
    "deepagents==0.7.28",
    "langchain-deepseek==1.1.1",
    "jieba==0.42.1",
    "qdrant-client==1.19.1",
    "fastembed==0.9.0",
    "portalocker==3.2.0",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/novel_agent", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
